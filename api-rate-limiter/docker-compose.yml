version: "3.9"

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  demo_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.demo
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - GATEWAY_ID=gateway-1
      - DEMO_BACKEND_URL=http://demo_backend:8001
      - ADMIN_TOKEN=dev-admin-token-change-in-production
      - FAIL_OPEN=false
    ports:
      - "8010:8000"
    depends_on:
      redis:
        condition: service_healthy
      demo_backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - GATEWAY_ID=gateway-2
      - DEMO_BACKEND_URL=http://demo_backend:8001
      - ADMIN_TOKEN=dev-admin-token-change-in-production
      - FAIL_OPEN=false
    ports:
      - "8011:8000"
    depends_on:
      redis:
        condition: service_healthy
      demo_backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway1
      - gateway2
      - frontend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080

volumes:
  redis_data:
