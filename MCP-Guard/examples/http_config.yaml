# HTTP gateway example. Replace the sample loopback upstream URL as needed.
# Set MCP_GUARD_CLIENT_TOKEN_HASH to the sha256:... output of `mcp-guard hash-token`.
# If the upstream requires its own bearer token, uncomment the header below and
# set MCP_GUARD_UPSTREAM_TOKEN in the environment.
mcp_guard:
  name: MCP-Guard HTTP Example
  environment: development
  transport: http
  default_policy: deny

  http:
    host: 127.0.0.1
    port: 8080
    upstream_url: http://127.0.0.1:9000/mcp
    allowed_origins: []
    upstream_headers: {}
    # To set upstream authentication, replace {} with:
    # upstream_headers:
    #   Authorization: "Bearer ${MCP_GUARD_UPSTREAM_TOKEN}"

  upstreams:
    customer_database:
      name: customer_database
      url: http://127.0.0.1:9000/mcp

  identity:
    agents:
      support_agent:
        id: support-agent-01
        name: Customer Support Agent
        enabled: true
        servers:
          - customer_database
        api_key_hash: "${MCP_GUARD_CLIENT_TOKEN_HASH}"

  policy:
    default_action: deny
    agents:
      support-agent-01:
        servers:
          customer_database:
            enabled: true
            tools:
              get_customer:
                action: allow
              search_customer:
                action: allow
              generate_report:
                action: allow
              update_customer:
                action: approval_required
              delete_customer:
                action: deny

  logging:
    format: jsonl
    level: INFO
    file: logs/http-audit.jsonl
    max_size_mb: 100
    backup_count: 5
    log_arguments: false
    log_responses: false

  security:
    max_message_size: 1048576
    request_timeout_seconds: 30
    enable_dlp: true
