# MCP-Guard Demo Configuration
# Used for the demonstration scenario.

mcp_guard:
  name: MCP-Guard Demo
  environment: development
  transport: stdio
  default_policy: deny

  stdio:
    upstream:
      name: customer_database
      command:
        - python3
        - examples/demo_server.py

  identity:
    agent_id: support-agent-01
    agents:
      support_agent:
        id: support-agent-01
        name: Customer Support Agent
        enabled: true
        servers:
          - customer_database

  policy:
    default_action: deny
    agents:
      support-agent-01:
        servers:
          customer_database:
            enabled: true
            tools:
              get_customer:
                action: allow
              search_customer:
                action: allow
              generate_report:
                action: allow
              update_customer:
                action: approval_required
              delete_customer:
                action: deny

  logging:
    format: jsonl
    level: INFO
    file: logs/audit.jsonl

  security:
    max_message_size: 1048576
    request_timeout_seconds: 30
    enable_dlp: true
